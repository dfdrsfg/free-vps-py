name: Keep HuggingFace Space Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # 每10分钟运行一次
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Space Alive
        run: |
          URL="https://qwe8899-h.hf.space"
          echo "Pinging $URL"
          curl -s -o /dev/null -w "%{http_code}" $URL
