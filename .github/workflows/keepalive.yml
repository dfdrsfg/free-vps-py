name: Keep HuggingFace Space Alive

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分钟运行一次
  workflow_dispatch:          # 可以手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Space Alive
        run: |
          URL="https://qwe8899/ccfy.hf.space"
          echo "Pinging $URL ..."
          curl -s -o /dev/null -w "%{http_code}\n" "$URL"
